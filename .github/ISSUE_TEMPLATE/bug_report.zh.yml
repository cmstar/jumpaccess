name: 问题反馈（中文）
description: 报告错误或与预期不符的行为，帮助我们复现和修复。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue 和 PR，协作约定见[贡献指南](https://github.com/cmstar/jumpaccess/blob/master/CONTRIBUTING.md)。
        请勿包含密码、Token、Cookie、私钥、OAuth 回调 URL 或生产数据；日志、配置和截图请先脱敏。
  - type: input
    id: version
    attributes:
      label: JumpAccess 版本与来源（可选）
      description: 直接下载程序时可填写版本号或下载来源，CLI 可执行 jumpctl version 查看版本；clone 源码运行或构建时可填写 Git commit。按已知信息填写，不清楚可留空。
      placeholder: 版本号、Git commit 或下载来源（填写已知信息即可）
    validations:
      required: false
  - type: dropdown
    id: entry
    attributes:
      label: 受影响的入口
      description: 可多选；不确定时请选择“不确定”。
      multiple: true
      options:
        - CLI（jumpctl）
        - 桌面 GUI（jumpaccess）
        - SSH ProxyCommand（外部客户端）
        - 构建、安装或文档
        - 不确定
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统版本和 CPU 架构；终端或连接问题尽量补充相关环境，不清楚的项目注明未知。
      placeholder: |
        操作系统与版本：
        CPU 架构（amd64 / arm64 等）：
        终端或外部 SSH 客户端及版本（如适用）：
        JumpServer 版本（如适用）：
        远端操作系统与 Shell（如适用）：
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 从必要的前置条件开始，列出操作或已脱敏的命令、配置片段。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 按上述步骤操作后，你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？请附相关报错，并说明是否每次都能复现。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 日志、截图与补充信息
      description: 可补充脱敏日志、截图、已知正常版本或尝试过的临时解决办法。粘贴或拖入图片即可添加截图。
